name: Build and Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
            
      - name: Download Godot 4.7
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          
      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          tar xzf ~/Godot_v4.7-stable_export_templates.tpz -C ~/.local/share/godot/export_templates/4.7.stable
      
      - name: Export Godot Project
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --export-release "Windows Desktop" ./builds/windows/Dungeon\ Life.exe
          ./Godot_v4.7-stable_linux.x86_64 --headless --export-release "Linux" ./builds/linux/Dungeon\ Life.zip

      - name: Download Butler
        run: |
          wget https://broth.itch.ovh/butler/linux-amd64/LATEST/butler -O ./butler
          chmod +x ./butler
          
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push ./builds/windows/ daremane/dungeon-life:windows
          ./butler push ./builds/linux/ daremane/dungeon-life:linux
