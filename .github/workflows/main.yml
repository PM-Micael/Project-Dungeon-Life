name: Build and Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
            
      - name: Download Godot 4.7
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          
      - name: Download Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/
          mkdir -p ~/.local/share/godot/export_templates/
          mv /tmp/templates ~/.local/share/godot/export_templates/4.7.stable
            
      - name: Export Godot Project
        run: |
          mkdir -p ./builds/windows ./builds/linux
          ./Godot_v4.7-stable_linux.x86_64 --headless --export-release "Windows Desktop" ./builds/windows/Dungeon\ Life.exe
          ./Godot_v4.7-stable_linux.x86_64 --headless --export-release "Linux" ./builds/linux/Dungeon\ Life.zip

      - name: Download Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V
                
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          BASE=$(cat VERSION)
          LAST_BUMP=$(git log -1 --format=%H -- VERSION)
          PATCH=$(git rev-list --count $LAST_BUMP..HEAD)
          VERSION="$BASE.$PATCH"
          echo "Publishing version $VERSION"
          ./butler-bin/butler push ./builds/windows/ daremane/dungeon-life:windows --userversion "$VERSION"
          ./butler-bin/butler push ./builds/linux/ daremane/dungeon-life:linux --userversion "$VERSION"
